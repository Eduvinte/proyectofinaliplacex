services:
  mysql:
    image: mysql:8.4
    container_name: saludvida-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: saludvida
      MYSQL_DATABASE: saludvida
    ports:
      - "3306:3306"
    volumes:
      - saludvida_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psaludvida"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  saludvida_mysql_data:
